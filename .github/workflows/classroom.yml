name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: CharacterCount
      id: charactercount
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: CharacterCount
        setup-command: javac CharacterCount.java
        command: java CharacterCount
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        CHARACTERCOUNT_RESULTS: "${{steps.charactercount.outputs.result}}"
      with:
        runners: charactercount
